services:
  charactersheet:
    build: .
    container_name: charactersheet
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CS_DATA_FILE=/data/users.json
    volumes:
      # Persist registered users + synced characters across redeploys.
      - ./data:/data
    # Fetching the SPA shell exercises Express *and* the built dist/, so an
    # image that came out without a build fails this rather than sitting there
    # "running". `deploy/update.sh` waits on it and rolls back if it never
    # goes healthy.
    # Probed with node rather than curl/wget: node is the one binary the image
    # is guaranteed to have.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [traefik_proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      # Expose at https://character.klatt.pro (syncdns registers the DNS record
      # from this Host rule; TLS via the shared Let's Encrypt resolver).
      - traefik.http.routers.charactersheet.rule=Host(`character.klatt.pro`)
      - traefik.http.routers.charactersheet.entrypoints=websecure
      - traefik.http.routers.charactersheet.tls.certresolver=le
      - traefik.http.routers.charactersheet.priority=100
      - traefik.http.routers.charactersheet.service=charactersheet
      - traefik.http.services.charactersheet.loadbalancer.server.port=3000

networks:
  traefik_proxy:
    external: true
